name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP-Syntax ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  javascript:
    name: JavaScript-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test 'tests/js/*.test.js'

  wordpress:
    name: WordPress-Tests
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, wp-cli
      - name: WordPress einrichten
        run: |
          wp core download --path=/tmp/wp --locale=de_DE
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/wp --url=http://localhost --title=Test --admin_user=admin --admin_password="$(openssl rand -hex 16)" --admin_email=admin@example.com --skip-email
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
        env:
          WP_ROOT: /tmp/wp

  paket:
    name: Release-Paket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh bin/paket-bauen.sh
